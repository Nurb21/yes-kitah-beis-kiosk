<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YES Kitah Beis Kiosk</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="home-screen">
    <header class="brand">
      <img src="assets/images/yes-logo.png"
     alt="Yeshiva Elementary School"
     class="school-logo">
      <h1>YES Kitah Beis</h1>
    </header>

    <section class="home-actions">
      <button class="big-button print-button" id="printBtn">
        <span class="button-icon">🖨️</span>
        <span>PRINT</span>
      </button>

      <button class="big-button listen-button" id="listenBtn">
        <span class="button-icon">🎧</span>
        <span>LISTEN</span>
      </button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
